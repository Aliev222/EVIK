</head>

// ═══════════════════════════════════════════════════════
// ICONS
// ═══════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════
// BASE COMPONENTS
// ═══════════════════════════════════════════════════════
const Btn = ({ children, variant = 'primary', onPress, disabled, style = {}, small }) => {
  const base = { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, borderRadius: 14, fontFamily: 'Manrope,sans-serif', fontWeight: 700, fontSize: small ? 14 : 16, cursor: disabled ? 'not-allowed' : 'pointer', border: 'none', transition: 'all 0.18s', userSelect: 'none', padding: small ? '10px 18px' : '16px 24px', opacity: disabled ? 0.45 : 1, letterSpacing: '0.01em', ...style };
  const variants = { primary: { background: C.orange, color: C.white }, secondary: { background: 'transparent', color: C.orange, border: `2px solid ${C.orange}` }, ghost: { background: C.gray100, color: C.black }, danger: { background: C.red, color: C.white }, green: { background: C.green, color: C.white }, dark: { background: C.black, color: C.white } };
  return <button style={{ ...base, ...variants[variant] }} onClick={disabled ? null : onPress} onMouseEnter={(e) => {if (!disabled) e.currentTarget.style.opacity = '0.85';}} onMouseLeave={(e) => {e.currentTarget.style.opacity = disabled ? '0.45' : '1';}}>{children}</button>;
};

const Avatar = ({ name = '', size = 44, color = C.orange }) =>
<div style={{ width: size, height: size, borderRadius: '50%', background: color, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 700, fontSize: size * 0.35, fontFamily: 'Manrope,sans-serif', flexShrink: 0 }}>

      <path d="M 0 60 Q 80 55 160 70 T 320 65 T 480 60" stroke="#fff" strokeWidth="2" fill="none" strokeDasharray="20 15" opacity="0.4" />
      <path d="M 40 0 Q 50 80 60 160 T 55 320" stroke={dark ? '#2d3f55' : '#ccd9c5'} strokeWidth="14" fill="none" />
      <path d="M 160 0 Q 170 80 165 160 T 168 320" stroke={dark ? '#2d3f55' : '#ccd9c5'} strokeWidth="10" fill="none" />
      <path d="M 0 150 Q 120 145 240 155 T 480 150" stroke={dark ? '#2d3f55' : '#ccd9c5'} strokeWidth="10" fill="none" />

const Marker = ({ type, x = '50%', y = '50%', pulse }) => {
  const colors = { client: C.orange, driver: C.green, dest: C.black };
  const col = colors[type] || C.orange;
  return (
    <div style={{ position: 'absolute', left: x, top: y, transform: 'translate(-50%,-100%)', zIndex: 10 }}>
      {pulse && <div style={{ position: 'absolute', width: 40, height: 40, borderRadius: '50%', border: `2px solid ${col}`, top: -6, left: -8, animation: 'pulseRing 1.5s ease-out infinite', opacity: 0.5 }} />}
      {pulse && <div style={{ position: 'absolute', width: 60, height: 60, borderRadius: '50%', border: `2px solid ${col}`, top: -16, left: -18, animation: 'pulseRing 1.5s ease-out infinite 0.5s', opacity: 0.3 }} />}
      <div style={{ width: 28, height: 28, borderRadius: '50% 50% 50% 0', background: col, border: '3px solid #fff', transform: 'rotate(-45deg)', boxShadow: '0 3px 10px rgba(0,0,0,0.25)' }} />

};

const RouteLine = ({ dark }) =>
<svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
    <path d="M 60 200 Q 120 160 180 140 Q 220 125 260 100" stroke={dark ? '#60a5fa' : C.orange} strokeWidth="4" fill="none" strokeLinecap="round" opacity="0.9" />

// ═══════════════════════════════════════════════════════
// TWEAKS PANEL (inline)
// ═══════════════════════════════════════════════════════
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:9999;width:260px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.9);color:#29261b;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px}
  .twk-x:hover{background:rgba(0,0,0,.08)}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:8px 0 0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between}
  .twk-lbl{font-weight:500;color:rgba(41,38,27,.72)}
  .twk-field{width:100%;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.12);border-radius:7px;background:rgba(255,255,255,.7);font:inherit;outline:none}
  select.twk-field{padding-right:20px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='rgba(0,0,0,.4)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:pointer;padding:0;flex-shrink:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return { tweaks: values, setTweak,
    TweaksPanel: ({ children }) => {
      const [open, setOpen] = React.useState(false);
      const ref = React.useRef(null);
      React.useEffect(() => {
        const onMsg = (e) => {
          if (e?.data?.type === '__activate_edit_mode') setOpen(true);
          if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);
      if (!open) return null;
      return <>
        <style>{__TWEAKS_STYLE}</style>
        <div ref={ref} className="twk-panel">
          <div className="twk-hd"><b>Tweaks</b>
            <button className="twk-x" onClick={() => {setOpen(false);window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');}}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      </>;
    },
    TweakSection: ({ title, children }) => <><div className="twk-sect">{title}</div>{children}</>,
    TweakToggle: ({ id, label }) =>
    <div className="twk-row twk-row-h">
        <span className="twk-lbl">{label}</span>
        <button className="twk-toggle" data-on={values[id] ? '1' : '0'} onClick={() => setTweak(id, !values[id])}><i /></button>
      </div>,

    TweakSelect: ({ id, label, options }) =>
    <div className="twk-row">
        <span className="twk-lbl">{label}</span>
        <select className="twk-field" value={values[id]} onChange={(e) => setTweak(id, e.target.value)}>
          {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      </div>

  };
}

// ═══════════════════════════════════════════════════════
// ONBOARDING SCREENS
// ═══════════════════════════════════════════════════════
const SplashScreen = ({ onDone }) => {
  const [phase, setPhase] = React.useState(0);
  React.useEffect(() => {
    const t1 = setTimeout(() => setPhase(1), 350);
    const t2 = setTimeout(() => setPhase(2), 950);
    const t3 = setTimeout(onDone, 2600);
    return () => [t1,t2,t3].forEach(clearTimeout);
  }, []);
  return (
    <div style={{flex:1, background:'#FAFAFA', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden'}}>
      {/* subtle dot grid */}
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0.06}} xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#000"/></pattern></defs>
        <rect width="100%" height="100%" fill="url(#dots)"/>
      </svg>
      {/* warm glow top-right */}
      <div style={{position:'absolute',right:-80,top:-80,width:320,height:320,borderRadius:'50%',background:'radial-gradient(circle, rgba(255,107,53,0.10) 0%, transparent 70%)',pointerEvents:'none',transform:phase>=1?'scale(1)':'scale(0.3)',transition:'transform 1.4s cubic-bezier(0.16,1,0.3,1)'}}/>
      {/* Logo */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14,opacity:phase>=1?1:0,transform:phase>=1?'translateY(0)':'translateY(18px)',transition:'all 0.7s cubic-bezier(0.16,1,0.3,1)'}}>
        <div style={{width:72,height:72,borderRadius:22,background:C.black,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 12px 40px rgba(0,0,0,0.14)'}}>
          <Icon name="truck" size={34} color="#fff"/>
        </div>
        <div style={{fontSize:48,fontWeight:800,color:C.black,letterSpacing:'-0.05em',lineHeight:1,fontFamily:'Manrope,sans-serif'}}>EVIK</div>
      </div>
      {/* tagline */}
      <div style={{position:'absolute',bottom:88,fontSize:11,fontWeight:700,color:C.gray500,letterSpacing:'0.2em',textTransform:'uppercase',opacity:phase>=2?1:0,transform:phase>=2?'translateY(0)':'translateY(6px)',transition:'all 0.5s ease 0.1s'}}>
        Сервис эвакуаторов
      </div>
      {/* progress bar */}
      <div style={{position:'absolute',bottom:68,width:44,height:2,background:C.gray200,borderRadius:1,overflow:'hidden'}}>
        <div style={{height:'100%',background:C.orange,borderRadius:1,width:phase>=2?'100%':'0%',transition:'width 1.4s ease'}}/>
      </div>
    </div>
  );
};

      dotInactive: 'rgba(255,255,255,0.18)',
    },
  ];
  const r = roles[idx];

  const next = () => { setAnimDir(1); setIdx(i=>(i+1)%roles.length); };
  const prev = () => { setAnimDir(-1); setIdx(i=>(i-1+roles.length)%roles.length); };

  const onTouchStart = e => { startX.current = e.touches[0].clientX; isDragging.current = true; };
  const onTouchEnd = e => {
    if (!isDragging.current) return;
    isDragging.current = false;
    const dx = e.changedTouches[0].clientX - startX.current;
    if (dx < -50) next(); else if (dx > 50) prev();
  };
  const onMouseDown = e => { startX.current = e.clientX; isDragging.current = true; };
  const onMouseUp = e => {
    if (!isDragging.current) return;
    isDragging.current = false;
    const dx = e.clientX - startX.current;
    if (dx < -50) next(); else if (dx > 50) prev();
  };

  return (
    <div key={idx} style={{flex:1,display:'flex',flexDirection:'column',background:r.bg,position:'relative',overflow:'hidden',userSelect:'none',animation:'fadeIn 0.35s ease'}}
      onMouseDown={onMouseDown} onMouseUp={onMouseUp}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

      {/* Decorative circle */}
      <div style={{position:'absolute',right:-60,top:-60,width:260,height:260,borderRadius:'50%',background:idx===0?'rgba(255,107,53,0.07)':'rgba(255,107,53,0.13)',pointerEvents:'none'}}/>

        <div style={{display:'flex',gap:5}}>
          {roles.map((_,i)=><div key={i} style={{width:i===idx?22:6,height:6,borderRadius:3,background:i===idx?C.orange:r.dotInactive,transition:'all 0.35s'}}/>)}
        </div>
      </div>

      {/* Tag pill */}
      <div style={{padding:'22px 24px 0'}}>
        <div style={{display:'inline-flex',alignItems:'center',gap:7,background:idx===0?C.gray100:'rgba(255,255,255,0.08)',borderRadius:10,padding:'6px 12px',marginBottom:20}}>
          <span style={{fontSize:14}}>{r.icon}</span>
          <span style={{fontSize:11,fontWeight:700,color:idx===0?C.gray500:'rgba(255,255,255,0.45)',letterSpacing:'0.06em',textTransform:'uppercase'}}>{r.tag}</span>
        </div>

        {/* Big title */}
        <div style={{fontSize:40,fontWeight:800,color:r.textColor,lineHeight:1.08,letterSpacing:'-0.03em',whiteSpace:'pre-line',marginBottom:18,fontFamily:'Manrope,sans-serif'}}>
          {r.title}
        </div>
        <div style={{fontSize:15,color:r.subColor,lineHeight:1.65,fontWeight:500,whiteSpace:'pre-line'}}>
          {r.sub}
        </div>
      </div>

      {/* Stats row */}
      <div style={{padding:'28px 24px 0',display:'flex',gap:0}}>
        {r.stats.map((s,i)=>(
          <div key={i} style={{flex:1,paddingRight:i<r.stats.length-1?14:0,borderRight:i<r.stats.length-1?'1px solid '+(idx===0?C.gray200:'rgba(255,255,255,0.1)'):'none',marginRight:i<r.stats.length-1?14:0}}>
            <div style={{fontSize:15,fontWeight:800,color:r.textColor,marginBottom:3}}>{s.v}</div>
            <div style={{fontSize:10,color:idx===0?C.gray500:'rgba(255,255,255,0.35)',fontWeight:600,letterSpacing:'0.02em'}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* CTA */}
      <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',padding:'24px 24px 24px'}}>
        <button onClick={()=>onSelect(r.id)} style={{width:'100%',padding:'18px',borderRadius:18,background:C.orange,color:'#fff',fontFamily:'Manrope,sans-serif',fontWeight:700,fontSize:16,border:'none',cursor:'pointer',boxShadow:'0 8px 28px rgba(255,107,53,0.38)',marginBottom:16,letterSpacing:'0.01em'}}>

const SmsScreen = ({ onNext }) => {
  const [code, setCode] = React.useState(['', '', '', '', '', '']);
  const [timer, setTimer] = React.useState(75);
  const refs = [React.useRef(), React.useRef(), React.useRef(), React.useRef(), React.useRef(), React.useRef()];
  React.useEffect(() => {const t = setInterval(() => setTimer((p) => Math.max(0, p - 1)), 1000);return () => clearInterval(t);}, []);
  const filled = code.every((c) => c !== '');
  const handleChange = (i, v) => {const d = v.replace(/\D/g, '');if (!d) return;const nc = [...code];nc[i] = d[0];setCode(nc);if (i < 5) refs[i + 1].current && refs[i + 1].current.focus();if (nc.every((c) => c !== '')) onNext();};
  const handleKey = (i, e) => {if (e.key === 'Backspace' && !code[i] && i > 0) {const nc = [...code];nc[i - 1] = '';setCode(nc);refs[i - 1].current && refs[i - 1].current.focus();}};
  const mins = String(Math.floor(timer / 60)).padStart(2, '0'),secs = String(timer % 60).padStart(2, '0');
  return (
    <div style={{ flex: 1, background: C.white, display: 'flex', flexDirection: 'column', padding: '32px 24px' }}>
      <div style={{ marginBottom: 32 }}>
        <div style={{ fontSize: 26, fontWeight: 800, color: C.black, lineHeight: 1.2 }}>Введите код<br />из SMS</div>
        <div style={{ fontSize: 14, color: C.gray500, marginTop: 10 }}>Отправлен на +7 (999) 000-00-00</div>
      </div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginBottom: 28 }}>
        {code.map((c, i) => <input key={i} ref={refs[i]} value={c} maxLength={1} inputMode="numeric" onChange={(e) => handleChange(i, e.target.value)} onKeyDown={(e) => handleKey(i, e)} style={{ width: 44, height: 52, textAlign: 'center', fontSize: 20, fontWeight: 700, border: `2.5px solid ${c ? C.orange : C.gray200}`, borderRadius: 12, background: c ? C.orange + '10' : C.gray50, fontFamily: 'Manrope,sans-serif', color: C.black, outline: 'none', transition: 'all 0.15s' }} />)}
      </div>
      <div style={{ textAlign: 'center', flex: 1 }}>
        {timer > 0 ? <span style={{ fontSize: 14, color: C.gray500 }}>Повторить через <span style={{ fontWeight: 700, color: C.black }}>{mins}:{secs}</span></span> :
        <span onClick={() => setTimer(75)} style={{ fontSize: 14, color: C.orange, fontWeight: 700, cursor: 'pointer' }}>Отправить повторно</span>}
      </div>
      <Btn style={{ width: '100%' }} disabled={!filled} onPress={onNext}>Войти</Btn>
    </div>);

};

// ═══════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMap": false,
  "driverModerationStatus": "approved",
  "startScreen": "splash"
}/*EDITMODE-END*/;

const App = () => {
  const { tweaks, setTweak, TweaksPanel, TweakSection, TweakToggle, TweakSelect } = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState(tweaks.startScreen || 'splash');
  const [role, setRole] = React.useState(null);
  const [navTab, setNavTab] = React.useState('home');
  const [frameKey, setFrameKey] = React.useState(0);

  const go = (s) => {setFrameKey((k) => k + 1);setScreen(s);};

  const labels = {
    splash: 'Сплэш', role: 'Выбор роли', phone: 'Ввод телефона', sms: 'SMS-код',
    doc_upload: 'Загрузка документов', driver_profile: 'Профиль водителя', moderation: 'Модерация',
    driver_offline: 'Водитель: Оффлайн', driver_online: 'Водитель: Онлайн', driver_new_order: 'Водитель: Новый заказ', driver_active: 'Водитель: Активный заказ',
    client_idle: 'Клиент: Главная', client_select: 'Клиент: Выбор места', client_form: 'Клиент: Форма заказа',
    client_searching: 'Клиент: Поиск', client_assigned: 'Клиент: Водитель назначен',
    client_evacuating: 'Клиент: Эвакуация', client_done: 'Клиент: Завершено',
    client_orders: 'Клиент: История заказов', client_payment: 'Клиент: Оплата', client_profile: 'Клиент: Профиль',
    driver_orders: 'Водитель: Заказы', driver_earnings: 'Водитель: Доходы', driver_profile_tab: 'Водитель: Профиль',
  };

  const mapScreens = ['client_idle', 'client_select', 'client_searching', 'client_assigned', 'client_evacuating', 'driver_online', 'driver_active', 'driver_new_order'];
  const darkStatus = mapScreens.includes(screen) || screen === 'splash';

  // Auto-advance searching → assigned
  React.useEffect(() => {
    if (screen === 'client_searching') {
      const t = setTimeout(() => go('client_assigned'), 5000);
      return () => clearTimeout(t);
    }
  }, [screen]);

  const renderContent = () => {
    switch (screen) {
      case 'splash':return <SplashScreen onDone={() => go('role')} />;
      case 'role':return <Screen><RoleScreen onSelect={(r) => {setRole(r);go('phone');}} /></Screen>;
      case 'phone':return <Screen><PhoneScreen onNext={() => go('sms')} /></Screen>;
      case 'sms':return <Screen><SmsScreen onNext={() => go(role === 'driver' ? 'doc_upload' : 'client_idle')} /></Screen>;
      case 'doc_upload':return <Screen><DocUploadScreen onNext={() => go('driver_profile')} /></Screen>;
      case 'driver_profile':return <Screen><DriverProfileScreen onNext={() => go('moderation')} /></Screen>;
      case 'moderation':return <Screen><ModerationScreen status={tweaks.driverModerationStatus} onApproved={() => go('driver_offline')} /></Screen>;
      case 'driver_offline':return <Screen><DriverOffline onGoOnline={()=>go('driver_online')}/><DriverBottomNav active="home" onNav={t=>go({home:'driver_offline',orders:'driver_orders',earnings:'driver_earnings',profile:'driver_profile_tab'}[t]||'driver_offline')}/></Screen>;
      case 'driver_online':return <Screen><DriverOnline onOrderPress={()=>go('driver_new_order')} onGoOffline={()=>go('driver_offline')}/><DriverBottomNav active="home" onNav={t=>go({home:'driver_online',orders:'driver_orders',earnings:'driver_earnings',profile:'driver_profile_tab'}[t]||'driver_online')}/></Screen>;
      case 'driver_new_order':return <Screen><DriverNewOrder onAccept={() => go('driver_active')} onDecline={() => go('driver_online')} /></Screen>;
      case 'driver_active':return <Screen><DriverActiveOrder onComplete={()=>go('driver_online')}/><DriverBottomNav active="home" onNav={t=>go({home:'driver_online',orders:'driver_orders',earnings:'driver_earnings',profile:'driver_profile_tab'}[t]||'driver_online')}/></Screen>;
      case 'client_idle':return <Screen anim="fadeIn"><ClientIdle onOrder={()=>go('client_select')} darkMap={tweaks.darkMap}/><ClientBottomNav active="home" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;
      case 'client_select':return <Screen><ClientSelecting onConfirm={() => go('client_form')} onBack={() => go('client_idle')} /></Screen>;
      case 'client_form':return <Screen><ClientOrderForm onSubmit={() => go('client_searching')} onBack={() => go('client_select')} /></Screen>;
      case 'client_searching':return <Screen><ClientSearching onCancel={() => go('client_idle')} /></Screen>;
      case 'client_assigned':return <Screen><ClientDriverAssigned onNext={()=>go('client_evacuating')}/><ClientBottomNav active="home" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;
      case 'client_evacuating':return <Screen><ClientEvacuating onNext={()=>go('client_done')}/><ClientBottomNav active="home" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;
      case 'client_done':return <Screen><ClientCompleted onReset={()=>go('client_idle')}/><ClientBottomNav active="home" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;

      case 'client_orders':return <Screen><ClientOrders/><ClientBottomNav active="history" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;
      case 'client_payment':return <Screen><ClientPayment/><ClientBottomNav active="wallet" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;
      case 'client_profile':return <Screen><ClientProfile onLogout={()=>go('role')}/><ClientBottomNav active="profile" onNav={t=>go({home:'client_idle',history:'client_orders',wallet:'client_payment',profile:'client_profile'}[t]||'client_idle')}/></Screen>;
      case 'driver_orders':return <Screen><DriverOrders/><DriverBottomNav active="orders" onNav={t=>go({home:'driver_online',orders:'driver_orders',earnings:'driver_earnings',profile:'driver_profile_tab'}[t]||'driver_online')}/></Screen>;
      case 'driver_earnings':return <Screen><DriverEarnings/><DriverBottomNav active="earnings" onNav={t=>go({home:'driver_online',orders:'driver_orders',earnings:'driver_earnings',profile:'driver_profile_tab'}[t]||'driver_online')}/></Screen>;
      case 'driver_profile_tab':return <Screen><DriverProfileTab onLogout={()=>go('role')}/><DriverBottomNav active="profile" onNav={t=>go({home:'driver_online',orders:'driver_orders',earnings:'driver_earnings',profile:'driver_profile_tab'}[t]||'driver_online')}/></Screen>;
      default:return <div style={{flex:1,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',color:'#999'}}>...</div>;
    }
  };

  return (
    <div style={{ width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
      <div style={{ position: 'fixed', inset: 0, background: 'radial-gradient(ellipse at 30% 40%,#1a1a2e 0%,#0d0d0d 100%)' }} />
      <QuickNav current={screen} onJump={go} />
      <div style={{ position: 'relative', zIndex: 10 }}>
        <ScreenLabel label={labels[screen] || screen} />
        <PhoneShell key={frameKey} statusLight={darkStatus}>
          {renderContent()}
        </PhoneShell>
        <div style={{ position: 'absolute', bottom: -30, left: 0, right: 0, textAlign: 'center' }}>
          <span style={{ fontSize: 10, color: 'rgba(255,255,255,0.25)', fontWeight: 500 }}>Используйте меню слева для навигации между экранами</span>
        </div>
      </div>
      <TweaksPanel>
        <TweakSection title="Карта">
          <TweakToggle id="darkMap" label="Тёмная тема карты" />
        </TweakSection>
        <TweakSection title="Водитель: Модерация">
          <TweakSelect id="driverModerationStatus" label="Статус" options={[
          { value: 'pending', label: '⏳ Ожидание' },
          { value: 'rejected', label: '❌ Отклонено' },
          { value: 'approved', label: '✅ Одобрено' }]
          } />
        </TweakSection>
        <TweakSection title="Стартовый экран">
          <TweakSelect id="startScreen" label="Начать с" options={[
          { value: 'splash', label: 'Сплэш' },
          { value: 'role', label: 'Выбор роли' },
          { value: 'client_idle', label: 'Клиент: Главная' },
          { value: 'driver_offline', label: 'Водитель: Оффлайн' }]
          } />
        </TweakSection>
      </TweaksPanel>
    </div>);

};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
