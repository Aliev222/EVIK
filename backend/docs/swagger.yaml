basePath: /api/v1
definitions:
  http.AcceptOrderRequest:
    properties:
      driver_id:
        example: driver-123
        type: string
    type: object
  http.AddPayoutMethodRequest:
    properties:
      is_default:
        example: true
        type: boolean
      masked_value:
        example: '****1234'
        type: string
      provider_recipient_id:
        example: account-123
        type: string
      type:
        enum:
        - bank_card
        - wallet
        example: bank_card
        type: string
    type: object
  http.AdminDecisionRequest:
    properties:
      reason:
        example: Documents are valid
        type: string
      vehicle_model:
        example: Toyota Camry
        type: string
      vehicle_plate:
        example: A123BC777
        type: string
      vehicle_type:
        enum:
        - winch
        - platform
        - manipulator
        example: winch
        type: string
    type: object
  http.AdminLoginRequest:
    properties:
      password:
        example: admin123
        type: string
      user_id:
        example: admin
        type: string
    type: object
  http.ApplyPromocodeRequest:
    properties:
      code:
        example: EVIK2025
        type: string
    type: object
  http.AuthTokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  http.AuthUser:
    properties:
      full_name:
        example: Ivan Ivanov
        type: string
      id:
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        example: client
        type: string
    type: object
  http.CalculatePriceRequest:
    properties:
      dropoff_lat:
        example: 55.76
        type: number
      dropoff_lng:
        example: 37.62
        type: number
      pickup_lat:
        example: 55.7522
        type: number
      pickup_lng:
        example: 37.6156
        type: number
      tow_truck_type:
        enum:
        - winch
        - platform
        - manipulator
        example: winch
        type: string
    type: object
  http.CalculateRouteRequest:
    properties:
      driver_lat:
        example: 55.75
        type: number
      driver_lng:
        example: 37.6
        type: number
    type: object
  http.CancelOrderRequest:
    properties:
      reason:
        example: cancel reason
        type: string
    type: object
  http.CityNameRequest:
    properties:
      name:
        example: Moscow
        type: string
    type: object
  http.CoordinateDTO:
    properties:
      lat:
        example: 55.7522
        type: number
      lng:
        example: 37.6156
        type: number
    type: object
  http.CreateOrderPaymentRequest:
    properties:
      payment_method:
        enum:
        - cash
        - card
        example: card
        type: string
    type: object
  http.CreateOrderRequest:
    properties:
      auto_dispatch:
        example: false
        type: boolean
      dropoff_address:
        example: ул. Арбат, 10
        type: string
      dropoff_lat:
        example: 55.76
        type: number
      dropoff_lng:
        example: 37.62
        type: number
      payment_method:
        enum:
        - cash
        - card
        example: card
        type: string
      pickup_address:
        example: ул. Тверская, 1
        type: string
      pickup_lat:
        example: 55.7522
        type: number
      pickup_lng:
        example: 37.6156
        type: number
      tow_truck_type:
        enum:
        - winch
        - platform
        - manipulator
        example: winch
        type: string
    type: object
  http.CreatePaymentResponse:
    properties:
      payment:
        $ref: '#/definitions/http.PaymentDTO'
    type: object
  http.CreateReviewRequest:
    properties:
      driver_id:
        example: driver-123
        type: string
      order_id:
        example: order-123
        type: string
      stars:
        example: 5
        maximum: 5
        minimum: 1
        type: integer
      text:
        example: Great service!
        type: string
    type: object
  http.DeviceTokenRequest:
    properties:
      app_version:
        example: 1.1.0
        type: string
      fcm_token:
        example: fcm-token-123
        type: string
      platform:
        example: android
        type: string
      role:
        example: driver
        type: string
    type: object
  http.EmptyResponse:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  http.ErrorResponse:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  http.LoginRequest:
    properties:
      password:
        example: secret123
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        enum:
        - client
        - driver
        example: client
        type: string
    type: object
  http.LoginResponse:
    properties:
      tokens:
        $ref: '#/definitions/http.AuthTokens'
      user:
        $ref: '#/definitions/http.AuthUser'
    type: object
  http.MeResponse:
    properties:
      user:
        $ref: '#/definitions/http.AuthUser'
    type: object
  http.NPDConnectRequest:
    properties:
      inn:
        example: "1234567890"
        type: string
    type: object
  http.OTPRequest:
    properties:
      phone:
        example: "+79991234567"
        type: string
      role:
        enum:
        - client
        - driver
        example: client
        type: string
    type: object
  http.OTPVerifyRequest:
    properties:
      code:
        example: "123456"
        type: string
      full_name:
        example: Ivan Ivanov
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        enum:
        - client
        - driver
        example: client
        type: string
    type: object
  http.OrderDTO:
    properties:
      cancelled_at:
        type: string
      created_at:
        type: string
      driver_id:
        type: string
      dropoff:
        $ref: '#/definitions/http.CoordinateDTO'
      dropoff_address:
        example: ул. Арбат, 10
        type: string
      dropoff_lat:
        type: number
      dropoff_lng:
        type: number
      id:
        type: string
      is_cross_city:
        type: boolean
      pickup:
        $ref: '#/definitions/http.CoordinateDTO'
      pickup_address:
        example: ул. Тверская, 1
        type: string
      pickup_lat:
        type: number
      pickup_lng:
        type: number
      status:
        example: searching
        type: string
      surcharge_amount:
        type: integer
      surcharge_percent:
        type: integer
      tow_truck_type:
        example: winch
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  http.OrderListResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/http.OrderDTO'
        type: array
    type: object
  http.PaymentDTO:
    properties:
      amount:
        example: 800000
        type: integer
      confirmation_url:
        type: string
      created_at:
        type: string
      currency:
        example: RUB
        type: string
      id:
        type: string
      order_id:
        type: string
      payment_method:
        example: card
        type: string
      provider:
        example: yookassa
        type: string
      purpose:
        example: order
        type: string
      status:
        example: pending
        type: string
      user_id:
        type: string
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
  http.RefundRequest:
    properties:
      amount:
        example: 800000
        type: integer
      payment_id:
        example: pay-123
        type: string
      reason:
        example: Customer request
        type: string
    type: object
  http.RegisterRequest:
    properties:
      full_name:
        example: Ivan Ivanov
        type: string
      password:
        example: secret123
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        enum:
        - client
        - driver
        example: client
        type: string
    type: object
  http.RequestPayoutRequest:
    properties:
      amount:
        example: 500000
        type: integer
    type: object
  http.SetDriverStatusRequest:
    properties:
      lat:
        example: 55.7522
        type: number
      lng:
        example: 37.6156
        type: number
      status:
        enum:
        - online
        - offline
        example: online
        type: string
    type: object
  http.SingleOrderResponse:
    properties:
      order:
        $ref: '#/definitions/http.OrderDTO'
    type: object
  http.SubmitDriverVerificationRequest:
    properties:
      city:
        example: Moscow
        type: string
      documents:
        example:
        - passport
        - license
        - vehicleDocs
        items:
          type: string
        type: array
      full_name:
        example: Ivan Ivanov
        type: string
      phone:
        example: "+79991234567"
        type: string
      user_id:
        example: driver-123
        type: string
      vehicle_model:
        example: Toyota Camry
        type: string
      vehicle_plate:
        example: A123BC777
        type: string
      vehicle_type:
        enum:
        - winch
        - platform
        - manipulator
        example: winch
        type: string
    type: object
  http.SubscriptionPaymentRequest:
    properties:
      plan_id:
        example: plan-monthly
        type: string
    type: object
  http.TaxProfileRequest:
    properties:
      inn:
        example: "1234567890"
        type: string
      taxpayer_type:
        enum:
        - self_employed
        - ip
        example: self_employed
        type: string
    type: object
  http.UpdateOrderStatusRequest:
    properties:
      status:
        enum:
        - accepted
        - arrived
        - in_progress
        - completed
        example: arrived
        type: string
    type: object
  http.YooKassaWebhookObject:
    properties:
      id:
        example: 22e12f66-000f-5000-8000-18db351245c7
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      paid:
        example: true
        type: boolean
      status:
        example: succeeded
        type: string
    type: object
  http.YooKassaWebhookRequest:
    properties:
      event:
        example: payment.succeeded
        type: string
      object:
        $ref: '#/definitions/http.YooKassaWebhookObject'
      type:
        example: notification
        type: string
    type: object
  http.autocompleteResult:
    properties:
      display_name:
        type: string
      lat:
        type: number
      lng:
        type: number
      max_lat:
        type: number
      max_lng:
        type: number
      min_lat:
        type: number
      min_lng:
        type: number
      osm_id:
        type: string
      type:
        type: string
    type: object
  http.driverLocationResponse:
    properties:
      avatar_url:
        type: string
      driver_id:
        type: string
      full_name:
        type: string
      last_seen_at:
        type: string
      lat:
        type: number
      lng:
        type: number
      phone:
        type: string
      status:
        type: string
      vehicle_plate:
        type: string
    type: object
  http.routePoint:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  http.routePreviewResponse:
    properties:
      distanceMeters:
        type: number
      durationSeconds:
        type: integer
      points:
        items:
          $ref: '#/definitions/http.routePoint'
        type: array
    type: object
info:
  contact: {}
  description: Tow truck marketplace API — auth, orders, drivers, payments, payouts,
    admin, reviews, routing, pricing, cities, webhooks, real-time.
  title: Tow Truck Backend API
  version: "1.0"
paths:
  /admin/cities:
    get:
      description: Returns all service areas (cities), both active and inactive.
      produces:
      - application/json
      responses:
        "200":
          description: list of cities
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List cities (admin)
      tags:
      - cities
    post:
      consumes:
      - application/json
      description: Geocodes a city name, checks for duplicate slugs, and creates an
        active service area.
      parameters:
      - description: City name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CityNameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created city
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: city with this slug already exists
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create city (admin)
      tags:
      - cities
  /admin/cities/{id}:
    delete:
      description: Hard-deletes a service area. Fails if there are active orders in
        this city.
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: deleted confirmation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: city not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: city has active orders
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete city (admin)
      tags:
      - cities
    patch:
      consumes:
      - application/json
      description: Toggles the active status of a service area (city).
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: updated city
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: city not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update city (admin)
      tags:
      - cities
  /admin/cities/autocomplete:
    get:
      description: Returns up to 5 Nominatim suggestions for a partial city name.
        Requires at least 3 characters.
      parameters:
      - description: Partial city name (min 3 chars)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: city suggestions
          schema:
            items:
              $ref: '#/definitions/http.autocompleteResult'
            type: array
      security:
      - BearerAuth: []
      summary: Autocomplete city name (admin)
      tags:
      - cities
  /admin/cities/search:
    post:
      consumes:
      - application/json
      description: Geocodes a city name via Nominatim and returns a preview with bounding
        box and center coordinates.
      parameters:
      - description: City name to search
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CityNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: city geocoding result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: city not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search city (admin)
      tags:
      - cities
  /admin/driver-verifications:
    get:
      description: Returns all driver verification requests for admin review.
      produces:
      - application/json
      responses:
        "200":
          description: list of driver verifications
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List driver verifications (admin)
      tags:
      - admin
  /admin/drivers-online:
    get:
      description: Returns currently online drivers with their last known locations
        for the live map.
      produces:
      - application/json
      responses:
        "200":
          description: online drivers with locations
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List online drivers (admin)
      tags:
      - admin
  /admin/drivers/locations:
    get:
      description: Returns live driver locations for the admin map. Can be filtered
        by city and status.
      parameters:
      - description: Filter by city ID
        in: query
        name: city_id
        type: string
      - description: Filter by status
        enum:
        - online
        - offline
        - busy
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: driver locations
          schema:
            items:
              $ref: '#/definitions/http.driverLocationResponse'
            type: array
        "400":
          description: invalid params
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: city not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List driver locations (admin)
      tags:
      - admin
  /admin/finance/export:
    get:
      description: Exports a finance report as CSV. Admin-only endpoint.
      parameters:
      - description: Report type
        enum:
        - payments
        - payouts
        - orders
        in: query
        name: type
        required: true
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV file
          schema:
            type: string
        "400":
          description: invalid report type
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Export finance report (admin)
      tags:
      - admin
  /admin/finance/payouts/{payoutID}/approve:
    post:
      description: Approves a pending driver payout. Admin-only endpoint.
      parameters:
      - description: Payout ID
        in: path
        name: payoutID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: approved payout
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: payout not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: payout not in approvable status
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve payout (admin)
      tags:
      - admin
  /admin/finance/payouts/{payoutID}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a pending driver payout with a reason. Admin-only endpoint.
      parameters:
      - description: Payout ID
        in: path
        name: payoutID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: rejected payout
          schema:
            additionalProperties: true
            type: object
        "400":
          description: reason is required (min 8 chars)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: payout not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: payout not in rejectable status
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reject payout (admin)
      tags:
      - admin
  /admin/finance/refunds:
    get:
      description: Returns paginated refunds with optional filters. Admin-only.
      parameters:
      - description: Filter by status
        enum:
        - pending
        - succeeded
        - failed
        in: query
        name: status
        type: string
      - description: Filter by payment ID
        in: query
        name: payment_id
        type: string
      - description: Filter by order ID
        in: query
        name: order_id
        type: string
      - description: Start date (RFC3339)
        in: query
        name: from
        type: string
      - description: End date (RFC3339)
        in: query
        name: to
        type: string
      - description: Max items (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated refunds with total count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List refunds (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Creates a refund for a completed payment. Admin-only endpoint.
      parameters:
      - description: Refund payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.RefundRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created refund
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create refund (admin)
      tags:
      - admin
  /admin/finance/report/{reportType}:
    get:
      description: Returns a finance report as JSON. Admin-only endpoint.
      parameters:
      - description: Report type
        in: path
        name: reportType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: report rows
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid report type
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Finance report (admin)
      tags:
      - admin
  /admin/moderation/driver-verifications/{verificationID}/approve:
    post:
      consumes:
      - application/json
      description: Approves a driver's document verification with optional vehicle
        details.
      parameters:
      - description: Verification ID
        in: path
        name: verificationID
        required: true
        type: string
      - description: Decision with vehicle details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AdminDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: approval status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve verification (admin)
      tags:
      - admin
  /admin/moderation/driver-verifications/{verificationID}/block:
    post:
      consumes:
      - application/json
      description: Blocks a driver's verification. Admin-only endpoint.
      parameters:
      - description: Verification ID
        in: path
        name: verificationID
        required: true
        type: string
      - description: Decision with reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AdminDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: block status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: reason required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Block verification (admin)
      tags:
      - admin
  /admin/moderation/driver-verifications/{verificationID}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a driver's document verification with a reason.
      parameters:
      - description: Verification ID
        in: path
        name: verificationID
        required: true
        type: string
