name: evik_frontend
description: Uber-like tow truck app frontend
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/iconapp.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/img/iconapp_fg.png"
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: "assets/img/iconapp.png"
  windows:
    generate: true
    image_path: "assets/img/iconapp.png"
  macos:
    generate: true
    image_path: "assets/img/iconapp.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
