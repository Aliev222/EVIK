name: tow_truck_frontend
description: Professional tow truck service app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_riverpod: ^2.5.1

  # Maps & Location
  geolocator: ^13.0.2

  # Networking & Utils
  http: ^1.2.2
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1

  # UI & Utils
  go_router: ^14.6.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  just_audio: ^0.10.5
  package_info_plus: ^8.0.0
  vibration: ^3.1.8
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_map_animations: ^0.10.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/img/app_icon_load.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img/app_icon_load_fg.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/img/app_icon_load.png"
  windows:
    generate: true
    image_path: "assets/img/app_icon_load.png"
  macos:
    generate: true
    image_path: "assets/img/app_icon_load.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/images/vehicles/
