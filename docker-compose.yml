version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: evik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evik
      POSTGRES_USER: evik
      POSTGRES_PASSWORD: evik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: evik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  admin-web:
    build: ./admin-web
    container_name: evik-admin-web
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      ADMIN_WEB_ADDR: ":5174"
      ADMIN_API_BASE_URL: ${ADMIN_API_BASE_URL:-http://host.docker.internal:8080}

volumes:
  postgres_data:
  redis_data:
